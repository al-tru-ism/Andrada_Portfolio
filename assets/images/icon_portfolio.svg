<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Container (Clean Dark Theme) -->
  <rect width="100" height="100" rx="22" fill="#0F172A" />

  <!-- Outer Security Shield (Cybersecurity) -->
  <path d="M50 18 L76 28 V48 C76 64 63 76 50 82 C37 76 24 64 24 48 V28 Z" 
        fill="none" 
        stroke="#1E293B" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Data Grid Backdrop (Subtle Network/Analytics Motif) -->
  <circle cx="50" cy="50" r="28" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" fill="none" />

  <!-- Main Monoline "J" Symbol -->
  <!-- Combining: Data Bars (Top) + Code Prompt '>' (Middle) + Terminal Hook (Base) -->
  <path d="M 60 32 V 58 C 60 68, 48 72, 40 66 C 35 62, 36 54, 42 54" 
        fill="none" 
        stroke="#06B6D4" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Analytics Line Accent (Integrated with the J stem) -->
  <path d="M 44 32 V 46 L 52 40 L 60 48" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Security Node / Data Point -->
  <circle cx="60" cy="32" r="4" fill="#38BDF8" />
  <circle cx="42" cy="54" r="2.5" fill="#10B981" />
</svg>
